name: Practica 4 - GitHub Actions

on:
  push:
    branches:
      - main

jobs:
  hola-mundo:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Ejecutar Hola Mundo
        run: node hola.js

      - name: Enviar notificacion
        run: |
          curl \
            -H "Title: Practica 4 - GitHub Actions" \
            -H "Priority: default" \
            -H "Tags: rocket,white_check_mark" \
            -d "Jeffrey Mercado - La Practica 4 se ejecuto correctamente. Proyecto: practica-4-action. Rama: main. GitHub Actions funcionando correctamente." \
            https://ntfy.sh/devops-itla